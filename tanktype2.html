<head>
<meta charset="utf-8" />
<title>Tank Turn Battle — Real Visuals & Hitboxes (完全版)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b1220;--sky1:#6ab;--sky2:#48a;}
  html,body{height:100%;margin:0;background:var(--bg);color:#eef;font-family:system-ui,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
  .wrap{max-width:1100px;margin:12px auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  canvas{border-radius:10px;box-shadow:0 8px 36px rgba(0,0,0,.6);background:linear-gradient(var(--sky1),var(--sky2))}
  .ui{width:900px;display:flex;gap:8px;align-items:center}
  input{flex:1;padding:10px;border-radius:6px;border:1px solid #333;background:#111;color:#fff}
  button{padding:8px 12px;border-radius:6px;border:none;background:#2b7;color:#012;cursor:pointer}
  .info{width:900px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .hp{display:flex;gap:8px;align-items:center}
  .bar{width:180px;height:12px;background:#222;border-radius:6px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(#ff7,#f33);width:100%}
  .fill.enemy{background:linear-gradient(#7cf,#28f)}
  .state{font-weight:700}
  .log{width:900px;height:120px;background:#071;border-radius:6px;padding:8px;overflow:auto;color:#cfc;font-family:monospace;font-size:13px}
  small{color:#9df}
</style>
</head>
<body>
<div class="wrap">
  <h2>Tank Turn Battle — Real Visuals & Hitboxes</h2>

  <canvas id="game" width="900" height="460"></canvas>

  <div class="ui">
    <input id="cmd" placeholder="Type: fire / move (press Enter)" autocomplete="off" />
    <button id="clear">Clear</button>
    <div style="font-size:12px;color:#bfe">Mouse: aim turret · Arrow keys: move when move-mode on</div>
  </div>

  <div class="info">
    <div class="hp">
      <div>Player HP</div>
      <div class="bar"><div id="pbar" class="fill" style="width:100%"></div></div>
      <div id="pHp">300</div>
    </div>
    <div class="hp">
      <div>Enemy Tank</div>
      <div class="bar"><div id="ebar" class="fill enemy" style="width:100%"></div></div>
      <div id="eHp">200</div>
    </div>
    <div class="hp">
      <div>APC</div>
      <div class="bar"><div id="abar" class="fill" style="width:100%;background:linear-gradient(#ffb,#f90)"></div></div>
      <div id="aHp">120</div>
    </div>
    <div class="state">State: <span id="state">Player Turn</span></div>
  </div>

  <div class="log" id="log"></div>
  <small>リアル外観・命中は戦車の実際の形状に当たるようになったぜ。</small>
</div>

<script>
(() => {
  // -------------------------
  // Setup
  // -------------------------
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;

  const cmd = document.getElementById('cmd');
  const clearBtn = document.getElementById('clear');
  const pHpEl = document.getElementById('pHp');
  const eHpEl = document.getElementById('eHp');
  const aHpEl = document.getElementById('aHp');
  const pbar = document.getElementById('pbar');
  const ebar = document.getElementById('ebar');
  const abar = document.getElementById('abar');
  const stateEl = document.getElementById('state');
  const logEl = document.getElementById('log');

  // -------------------------
  // Game constants & state
  // -------------------------
  const PLAYER_MAX = 300;
  const ENEMY_TANK_MAX = 200;
  const APC_MAX = 120;
  const SHELL_DMG = 10;
  const MG_DMG = 5;

  let player = {
    x: 140, y: 0, w: 92, h: 36,
    turretAng: -0.2, hp: PLAYER_MAX,
    moveMode: false, canControl: true
  };
  let enemyTank = { x: 660, y: 0, w: 78, h: 36, hp: ENEMY_TANK_MAX };
  let apc = { x: 520, y: 0, w: 72, h: 32, hp: APC_MAX, present: true };

  const groundBaseY = H - 46;
  const ground = new Float32Array(W);
  for (let i=0;i<W;i++) ground[i] = 6 + Math.random()*5;
  function groundY(x){
    const ix = Math.max(0, Math.min(W-1, Math.floor(x)));
    return groundBaseY - ground[ix];
  }
  function crater(cx, r=18){
    const s = Math.max(0, Math.floor(cx - r));
    const e = Math.min(W-1, Math.floor(cx + r));
    for (let x=s;x<=e;x++){
      const d = Math.abs(x-cx);
      const factor = Math.max(0, 1 - d/r);
      ground[x] += factor * (6 + Math.random()*4);
    }
  }

  // projectiles
  const shells = []; // {x,y,vx,vy,owner,r}
  const mgBullets = []; // {x,y,vx,vy,life}

  // particles
  const particles = [];

  // game flow
  let isPlayerTurn = true;
  let enemyActing = false;
  let arrow = {left:false, right:false};
  let mouse = {x:0,y:0};

  // timing helpers
  function now(){ return performance.now(); }

  // -------------------------
  // Utilities: logging & hp UI
  // -------------------------
  function log(s){ logEl.innerHTML += s + '<br>'; logEl.scrollTop = logEl.scrollHeight; }
  function updateUI(){
    pHpEl.textContent = player.hp;
    eHpEl.textContent = enemyTank.hp;
    aHpEl.textContent = apc.hp;
    pbar.style.width = Math.max(0, (player.hp/PLAYER_MAX)*100) + '%';
    ebar.style.width = Math.max(0, (enemyTank.hp/ENEMY_TANK_MAX)*100) + '%';
    abar.style.width = Math.max(0, (apc.hp/APC_MAX)*100) + '%';
    stateEl.textContent = isPlayerTurn ? 'Player Turn' : 'Enemy Turn';
  }

  // -------------------------
  // Input
  // -------------------------
  cmd.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const c = cmd.value.trim().toLowerCase();
      cmd.value = '';
      handleCommand(c);
    }
  });
  clearBtn.onclick = () => { cmd.value=''; cmd.focus(); };

  cvs.addEventListener('mousemove', e => {
    const r = cvs.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    // turret always follows mouse (player can adjust during move)
    const cx = player.x + player.w/2;
    const cy = groundY(player.x) - player.h/2 + 6;
    player.turretAng = Math.atan2(mouse.y - cy, mouse.x - cx);
  });

  window.addEventListener('keydown', e=>{
    if (e.key === 'ArrowLeft') arrow.left = true;
    if (e.key === 'ArrowRight') arrow.right = true;
  });
  window.addEventListener('keyup', e=>{
    if (e.key === 'ArrowLeft') arrow.left = false;
    if (e.key === 'ArrowRight') arrow.right = false;
  });

  // -------------------------
  // Collision helpers
  // -------------------------
  // circle-rect collision
  function circleRect(cx, cy, r, rx, ry, rw, rh){
    // rx,ry are top-left
    const nearestX = Math.max(rx, Math.min(cx, rx+rw));
    const nearestY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - nearestX, dy = cy - nearestY;
    return dx*dx + dy*dy <= r*r;
  }
  // circle-line (capsule) collision: line from (x1,y1) to (x2,y2), radius r
  function circleLine(cx, cy, r, x1,y1,x2,y2){
    // project point onto segment
    const lx = x2-x1, ly = y2-y1;
    const l2 = lx*lx + ly*ly;
    if (l2 === 0) return ( (cx-x1)*(cx-x1) + (cy-y1)*(cy-y1) ) <= r*r;
    let t = ((cx - x1)*lx + (cy - y1)*ly) / l2;
    t = Math.max(0, Math.min(1, t));
    const px = x1 + t*lx, py = y1 + t*ly;
    const dx = cx - px, dy = cy - py;
    return dx*dx + dy*dy <= r*r;
  }

  // -------------------------
  // Drawing: realistic-ish tanks
  // -------------------------
  function drawTankReal(x, y, w, h, turretAng, color, drawTreads=true){
    // x,y = top-left of body
    // body with sloped front
    ctx.save();
    ctx.translate(x, y);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(4, h+3, w+8, 6);

    // body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.lineTo(w-12, 4);
    ctx.lineTo(w, h);
    ctx.lineTo(12, h);
    ctx.closePath();
    ctx.fill();

    // hull top
    ctx.fillStyle = shade(color, -10);
    ctx.fillRect(8, 8, w-16, h-18);

    // treads
    if (drawTreads){
      ctx.fillStyle = '#222';
      ctx.fillRect(-6, h-8, w+12, 12);
      // road wheels
      const wheels = 6;
      for (let i=0;i<wheels;i++){
        const wx = 6 + (w/(wheels+1))*(i+1);
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(wx, h+2, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(wx, h+2, 3.0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // turret
    ctx.save();
    const tx = w/2, ty = 8;
    ctx.translate(tx, ty);
    ctx.rotate(turretAng);
    ctx.fillStyle = shade(color, -15);
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI*2);
    ctx.fill();
    // barrel
    ctx.fillStyle = '#333';
    ctx.fillRect(0, -6, 44, 12);
    ctx.restore();

    ctx.restore();
  }
  function shade(hex, amt){
    // hex like '#rrggbb' or color name; fallback simple lighten/darken for rgb strings is complex — use rgba overlay
    // We'll approximate by returning hex unchanged (safe)
    return hex;
  }

  // -------------------------
  // Fire helper
  // -------------------------
  function spawnShell(x,y,angle,speed,owner){
    shells.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, owner, r:4 });
  }
  function spawnMg(x,y,angle,speed){
    mgBullets.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life:1.6 });
  }

  // -------------------------
  // Command handling
  // -------------------------
  function handleCommand(c){
    if (!isPlayerTurn){ flash('Not your turn'); return; }
    if (!c) return;
    if (c === 'move'){
      // enable move-mode for 3 sec; keep player turn active
      player.moveMode = true; player.canControl = true;
      log('MOVE mode ON for 3s — ← → で移動できる');
      stateEl.textContent = 'Move Mode';
      setTimeout(()=>{ player.moveMode = false; stateEl.textContent = 'Player Turn'; }, 3000);
      return;
    }
    if (c === 'fire'){
      if (!player.canControl){ flash('Cannot fire now'); return; }
      // compute barrel end
      const cx = player.x + player.w/2;
      const cy = groundY(player.x) - player.h/2 + 6;
      const sx = cx + Math.cos(player.turretAng)*40;
      const sy = cy + Math.sin(player.turretAng)*40;
      spawnShell(sx, sy, player.turretAng, 340, 'player');
      player.canControl = false;
      player.moveMode = false;
      endPlayerTurn();
      return;
    }
    flash('Use: move / fire');
  }

  function flash(msg){
    const prev = stateEl.textContent;
    stateEl.textContent = msg;
    setTimeout(()=>{ stateEl.textContent = prev; }, 800);
  }

  // -------------------------
  // Turn control
  // -------------------------
  function endPlayerTurn(){
    isPlayerTurn = false;
    stateEl.textContent = 'Enemy Turn';
    setTimeout(()=> enemyActAll(), 600);
  }

  // enemy acts: APC 50-shot mg then tank shell
  function enemyActAll(){
    enemyActing = true;
    log('Enemy: APC burst (if present) then tank shell');
    const doTankShot = () => {
      if (enemyTank.hp <= 0) { finishEnemyTurn(); return; }
      // aim at player, small noise
      const ex = enemyTank.x + enemyTank.w/2;
      const ey = groundY(enemyTank.x) - enemyTank.h/2 + 6;
      const tx = player.x + player.w/2;
      const ty = groundY(player.x) - player.h/2 + 6;
      let ang = Math.atan2(ty - ey, tx - ex) + (Math.random()*6 - 3) * Math.PI/180;
      spawnShell(ex + Math.cos(ang)*36, ey + Math.sin(ang)*36, ang, 320, 'enemyTank');
      // wait a bit, then finish turn when shell resolved in physics loop
      setTimeout(()=>{ /* nothing */ }, 300);
    };

    if (apc.present && apc.hp > 0){
      // 50-shot burst at interval 50ms
      let shots = 0;
      const interval = 50; // ms between bullets
      const mgTimer = setInterval(()=>{
        shots++;
        // spawn a visible mg bullet towards player with spread
        const ax = apc.x + apc.w/2;
        const ay = groundY(apc.x) - apc.h/2;
        const baseAng = Math.atan2((groundY(player.x) - player.h/2) - ay, (player.x + player.w/2) - ax);
        const ang = baseAng + (Math.random()*30 - 15) * Math.PI/180; // +/-15 deg
        const spd = 460 + Math.random()*80;
        spawnMg(ax + Math.cos(ang)*18, ay + Math.sin(ang)*18, ang, spd);
        // damage chance handled in physics loop when bullet hits
        if (shots >= 50){
          clearInterval(mgTimer);
          // after mg finished, do tank shot
          setTimeout(doTankShot, 220);
        }
      }, interval);
    } else {
      // no apc: directly tank shot
      setTimeout(doTankShot, 220);
    }
    // finishEnemyTurn will be called after shells resolve in physics loop
  }

  function finishEnemyTurn(){
    enemyActing = false;
    isPlayerTurn = true;
    player.canControl = true;
    stateEl.textContent = 'Player Turn';
    log('Enemy turn ended — your turn');
  }

  // -------------------------
  // Physics & collision step (runs each frame)
  // -------------------------
  function step(dt){
    // move while in moveMode
    if (player.moveMode && player.canControl){
      if (arrow.left) player.x -= 160 * dt;
      if (arrow.right) player.x += 160 * dt;
      player.x = Math.max(16, Math.min(W - player.w - 16, player.x));
    }

    // update shells
    for (let i = shells.length - 1; i >= 0; i--){
      const s = shells[i];
      s.vy += 600 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;

      // If out of bounds, remove
      if (s.x < -80 || s.x > W + 80 || s.y > H + 80){ shells.splice(i,1); continue; }

      // ground collision
      const gy = groundY(s.x);
      if (s.y >= gy){
        // explode
        spawnExplosion(s.x, gy - 6, 14);
        crater(s.x, 22);
        // damage
        if (s.owner === 'player'){
          // check enemy tank hitbox (rect)
          const etop = groundY(enemyTank.x) - enemyTank.h;
          if (circleRect(s.x, s.y, s.r, enemyTank.x, etop, enemyTank.w, enemyTank.h)){
            enemyTank.hp = Math.max(0, enemyTank.hp - SHELL_DMG);
            log('Player shell hit enemy tank: -10');
          }
          // check APC
          const atop = groundY(apc.x) - apc.h;
          if (apc.present && circleRect(s.x, s.y, s.r, apc.x, atop, apc.w, apc.h)){
            apc.hp = Math.max(0, apc.hp - SHELL_DMG);
            log('Player shell hit APC: -10');
          }
        } else if (s.owner === 'enemyTank'){
          // check player body, turret, barrel
          const ptop = groundY(player.x) - player.h;
          if (circleRect(s.x, s.y, s.r, player.x, ptop, player.w, player.h)) {
            player.hp = Math.max(0, player.hp - SHELL_DMG);
            log('Enemy shell hit you: -10');
            updateUI();
          }
        }
        shells.splice(i,1);
        // After shell explosion, if it was player's and caused enemy dead -> check
        if (enemyTank.hp <= 0 && apc.hp <= 0){
          endGame('YOU WIN!');
        }
        // if this shell was enemy's and finished enemy actions, finish enemy turn
        if (!isPlayerTurn && s.owner === 'enemyTank'){
          // delay finish to let mg bullets resolve a bit
          setTimeout(()=> finishEnemyTurn(), 400);
        }
        continue;
      }

      // mid-air direct hit vs shapes (rectangle/turret/line)
      if (s.owner === 'player'){
        // enemy tank rect
        const etop = groundY(enemyTank.x) - enemyTank.h;
        if (circleRect(s.x, s.y, s.r, enemyTank.x, etop, enemyTank.w, enemyTank.h)){
          enemyTank.hp = Math.max(0, enemyTank.hp - SHELL_DMG);
          log('Direct hit: enemy tank -10');
          spawnExplosion(s.x,s.y,10); crater(s.x,18);
          shells.splice(i,1);
          if (enemyTank.hp <= 0 && apc.hp <= 0) endGame('YOU WIN!');
          continue;
        }
        // apc
        const atop = groundY(apc.x) - apc.h;
        if (apc.present && circleRect(s.x, s.y, s.r, apc.x, atop, apc.w, apc.h)){
          apc.hp = Math.max(0, apc.hp - SHELL_DMG);
          log('Direct hit: APC -10');
          spawnExplosion(s.x,s.y,10); crater(s.x,18);
          shells.splice(i,1);
          continue;
        }
      } else if (s.owner === 'enemyTank'){
        // check player hull rect
        const ptop = groundY(player.x) - player.h;
        if (circleRect(s.x, s.y, s.r, player.x, ptop, player.w, player.h)){
          player.hp = Math.max(0, player.hp - SHELL_DMG);
          log('Enemy shell direct hit! -10');
          spawnExplosion(s.x,s.y,10);
          shells.splice(i,1);
          if (player.hp <= 0) endGame('YOU LOSE...');
          continue;
        }
        // check barrel line collision (to allow shots hitting turret)
        // compute barrel line coords
      }
    }

    // mg bullets physics
    for (let i = mgBullets.length - 1; i >= 0; i--){
      const b = mgBullets[i];
      b.vy += 1000 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.x < -50 || b.x > W + 50 || b.y > H + 80 || b.life <= 0){ mgBullets.splice(i,1); continue; }

      // hit player?
      const ptop = groundY(player.x) - player.h;
      if (circleRect(b.x, b.y, 2.5, player.x, ptop, player.w, player.h)){
        player.hp = Math.max(0, player.hp - MG_DMG);
        spawnSmallHit(b.x,b.y);
        log('APC MG hit you -5');
        mgBullets.splice(i,1);
        if (player.hp <= 0) { endGame('YOU LOSE...'); return; }
        continue;
      }
    }

    // particles update
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.vy += 700 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.t += dt;
      if (p.t >= p.life) particles.splice(i,1);
    }

    // update UI
    updateUI();
  }

  function spawnExplosion(x,y,n=12){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const s = 40 + Math.random()*160;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4 + Math.random()*0.6, t:0 });
    }
  }
  function spawnSmallHit(x,y){
    for (let i=0;i<6;i++){
      const a = Math.random()*Math.PI*2;
      const s = 30 + Math.random()*60;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.2 + Math.random()*0.4, t:0 });
    }
  }

  // -------------------------
  // Render
  // -------------------------
  function render(){
    ctx.clearRect(0,0,W,H);

    // sky
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#7ec');
    g.addColorStop(1,'#3a7');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // distant hills
    ctx.fillStyle = '#113';
    ctx.beginPath();
    ctx.moveTo(0, H*0.6);
    ctx.quadraticCurveTo(W*0.25, H*0.45, W*0.5, H*0.6);
    ctx.quadraticCurveTo(W*0.75, H*0.75, W, H*0.6);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();

    // ground with contour
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath();
    ctx.moveTo(0,H);
    for (let x=0;x<W;x+=2) ctx.lineTo(x, groundY(x));
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

    // rocks / obstacles
    ctx.fillStyle = '#444';
    for (let i=0;i<6;i++){
      const rx = (i*170 + 60) % W;
      const ry = groundY(rx) - 8;
      ctx.fillRect(rx, ry, 28, 8);
    }

    // draw APC
    const apcY = groundY(apc.x) - apc.h;
    if (apc.present && apc.hp > 0){
      drawTankReal(apc.x, apcY, apc.w, apc.h, 0, '#7b5');
      // mg gun - draw small barrel pointing at player
      const apcCx = apc.x + apc.w/2; const apcCy = apcY + apc.h/2;
      const ang = Math.atan2((groundY(player.x)-player.h/2) - apcCy, (player.x + player.w/2) - apcCx);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(apcCx, apcCy); ctx.lineTo(apcCx + Math.cos(ang)*28, apcCy + Math.sin(ang)*28); ctx.stroke();
    }

    // draw enemy tank
    const eY = groundY(enemyTank.x) - enemyTank.h;
    drawTankReal(enemyTank.x, eY, enemyTank.w, enemyTank.h, 0, '#b55');

    // draw player
    const pY = groundY(player.x) - player.h;
    drawTankReal(player.x, pY, player.w, player.h, player.turretAng, '#cfc');

    // draw shells
    ctx.fillStyle = 'orange';
    for (const s of shells){
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    // draw mg bullets
    ctx.fillStyle = 'yellow';
    for (const b of mgBullets){
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
      ctx.fill();
    }

    // draw particles
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, 1 - (p.t / p.life));
      ctx.fillStyle = '#ff9966';
      ctx.fillRect(p.x, p.y, 2, 2);
      ctx.globalAlpha = 1;
    }
  }

  // -------------------------
  // Main loop
  // -------------------------
  let last = performance.now();
  function loop(){
    const nowt = performance.now();
    const dt = Math.min(0.033, (nowt - last) / 1000);
    last = nowt;

    step(dt);
    render();
    requestAnimationFrame(loop);
  }
  loop();

  // -------------------------
  // Helpers & game end
  // -------------------------
  function endGame(msg){
    log(msg);
    isPlayerTurn = false; enemyActing = true;
    stateEl.textContent = msg;
  }

  // -------------------------
  // debug: click to spawn test shell (optional)
  // -------------------------
  // collision & hit detection handled in step()
  // -------------------------
  // initialize UI
  updateUI();
  log('Ready. Type "move" or "fire".');

  // -------------------------
  // Expose handleCommand to input
  // -------------------------
  function userCmd(text){
    handleCommand(text);
  }
  // Attach input run
  window.handleCommand = handleCommand;

  // wire input button and enter key (already attached to cmd)
  // ensure click outside doesn't steal focus
  cmd.focus();

  // -------------------------
  // Event to allow pressing Enter from outside (for mobile)
  // -------------------------
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement !== cmd) {
      // if enter pressed elsewhere, open focus
      cmd.focus();
    }
  });

  // -------------------------
  // End of script
  // -------------------------
})();
</script>
</body>
</html>
