<!DOCTYPE html>
<html>
<body style="background:#222;color:#fff;font-family:sans-serif;text-align:center;">
<h1>ゲスト側</h1>
<p>接続先ID: <span id="roomId">1234</span></p>
<p>状態: <span id="status">接続中...</span></p>

<script src="peer.min.js"></script>
<script>
let roomId = "1234";
document.getElementById("roomId").textContent = roomId;

let peer = new Peer();
let conn;

peer.on("open", id => {
  document.getElementById("status").textContent = "PeerID取得: " + id;

  conn = peer.connect(roomId);

  conn.on("open", () => {
    document.getElementById("status").textContent = "ホストに接続完了";
    conn.send({msg:"ゲスト参加"});
  });

  conn.on("data", data => {
    console.log("ホスト→ゲスト:", data);
  });
});
</script>
</body>
</html>
