<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スマブラ風ゲーム</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    .screen { display: none; }
    .active { display: block; }
    button {
      padding: 12px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
    }
    #gameCanvas {
      background: #222;
      border: 2px solid #fff;
      display: block;
      margin: 10px auto;
    }
    .shop-item, .char-item {
      background: #333;
      padding: 10px;
      margin: 10px auto;
      width: 320px;
      border-radius: 8px;
    }
    #ui {
      margin-top: 5px;
      font-size: 14px;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <!-- ===== メニュー ===== -->
  <div id="menu" class="screen active">
    <h1>スマブラ風ゲーム</h1>
    <button onclick="goTo('charSelect')">キャラ選択 → CPU戦</button>
    <button onclick="goTo('shop')">ショップ</button>
  </div>

  <!-- ===== ショップ ===== -->
  <div id="shop" class="screen">
    <h1>ショップ</h1>

    <h2>キャラ販売</h2>

    <div class="char-item">
      <h3>スピードスター</h3>
      <p>移動速度 +20%</p>
      <button onclick="buy('speedster')">購入</button>
    </div>

    <div class="char-item">
      <h3>タンク</h3>
      <p>ノックバック耐性 +30%</p>
      <button onclick="buy('tank')">購入</button>
    </div>

    <div class="char-item">
      <h3>アサシン</h3>
      <p>攻撃力 +25%</p>
      <button onclick="buy('assassin')">購入</button>
    </div>

    <div class="char-item">
      <h3>ブレイザー</h3>
      <p>炎エフェクト付き攻撃</p>
      <button onclick="buy('blazer')">購入</button>
    </div>

    <h2>強化アイテム</h2>

    <div class="shop-item">
      <h3>攻撃力アップ +10%</h3>
      <button onclick="buy('atkUp')">購入</button>
    </div>

    <div class="shop-item">
      <h3>ジャンプ強化 +15%</h3>
      <button onclick="buy('jumpUp')">購入</button>
    </div>

    <div class="shop-item">
      <h3>CPU弱体化チケット</h3>
      <button onclick="buy('cpuWeak')">購入</button>
    </div>

    <div class="shop-item">
      <h3>ネオンステージスキン</h3>
      <button onclick="buy('neonStage')">購入</button>
    </div>

    <div class="shop-item">
      <h3>青い炎エフェクト</h3>
      <button onclick="buy('blueFlame')">購入</button>
    </div>

    <button onclick="goTo('menu')">メニューに戻る</button>
  </div>

  <!-- ===== キャラ選択 ===== -->
  <div id="charSelect" class="screen">
    <h1>キャラ選択</h1>
    <p>※購入済みキャラのみ選択可能</p>

    <button onclick="selectChar('fighter')">ファイター（標準）</button>
    <button onclick="selectChar('speedster')">スピードスター</button>
    <button onclick="selectChar('tank')">タンク</button>
    <button onclick="selectChar('assassin')">アサシン</button>
    <button onclick="selectChar('blazer')">ブレイザー</button>

    <button onclick="goTo('menu')">戻る</button>
  </div>

  <!-- ===== ゲーム画面 ===== -->
  <div id="game" class="screen">
    <h1>CPU戦</h1>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div id="ui"></div>
    <button onclick="stopGame(); goTo('menu')">メニューに戻る</button>
  </div>

  <script>
    // ===== 画面切り替え =====
    function goTo(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screen).classList.add('active');

      if (screen === 'game') startGame();
    }

    // ===== ショップ購入データ =====
    const items = {
      speedster: false,
      tank: false,
      assassin: false,
      blazer: false,
      atkUp: false,
      jumpUp: false,
      cpuWeak: false,
      neonStage: false,
      blueFlame: false
    };

    function buy(item) {
      items[item] = true;
      alert("購入しました！");
    }

    // ===== キャラ選択 =====
    let selectedCharacter = "fighter";

    function selectChar(char) {
      if (char !== "fighter" && !items[char]) {
        alert("このキャラは未購入です");
        return;
      }
      selectedCharacter = char;
      alert("選択しました！ CPU戦を開始します");
      goTo('game');
    }

    // ===== ゲーム本編 =====
    let gameRunning = false;
    let animationId = null;

    const GRAVITY = 0.7;
    const FLOOR_Y = 380;
    const STAGE_LEFT = 100;
    const STAGE_RIGHT = 800;
    const STAGE_TOP = 320;
    const BLAST_LEFT = -150;
    const BLAST_RIGHT = 900 + 150;
    const BLAST_TOP = -200;
    const BLAST_BOTTOM = 500 + 200;

    const ATTACK_COOLDOWN = 25;
    const ATTACK_DURATION = 10;
    const BASE_KNOCKBACK = 8;
    const KNOCKBACK_SCALE_BASE = 0.12;

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (currentP1) updateInputFromKeys();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (currentP1) updateInputFromKeys();
    });

    function updateInputFromKeys() {
      currentP1.input.left = !!keys['ArrowLeft'];
      currentP1.input.right = !!keys['ArrowRight'];
      currentP1.input.jump = !!keys['ArrowUp'];
      currentP1.input.attack = !!keys['Enter'];
    }

    function rectsOverlap(a, b) {
      return !(
        a.x + a.w < b.x ||
        a.x > b.x + b.w ||
        a.y + a.h < b.y ||
        a.y > b.y + b.h
      );
    }

    class Fighter {
      constructor(options) {
        this.id = options.id;
        this.x = options.x;
        this.y = options.y;
        this.vx = 0;
        this.vy = 0;
        this.width = 40;
        this.height = 60;
        this.color = options.color;
        this.facing = 1;
        this.onGround = false;

        this.damage = 0;
        this.stocks = 3;

        this.isCPU = options.isCPU || false;

        this.input = { left: false, right: false, jump: false, attack: false };

        this.attackTimer = 0;
        this.attackHitbox = null;
        this.attackCooldown = 0;
        this.hitstun = 0;

        // キャラ性能
        this.moveSpeed = options.moveSpeed || 4;
        this.atkMultiplier = options.atkMultiplier || 1.0;
        this.knockbackResist = options.knockbackResist || 1.0; // 小さいほど吹っ飛びにくい
        this.jumpPower = options.jumpPower || 14;
        this.flame = options.flame || false;
      }

      getHurtbox() {
        return { x: this.x, y: this.y, w: this.width, h: this.height };
      }

      startAttack() {
        if (this.attackCooldown > 0 || this.hitstun > 0) return;
        this.attackTimer = ATTACK_DURATION;
        this.attackCooldown = ATTACK_COOLDOWN;
        const range = 45;
        const w = 35;
        const h = 30;
        const x = this.facing === 1 ? this.x + this.width : this.x - w;
        const y = this.y + 10;
        this.attackHitbox = { x, y, w, h, ownerId: this.id, active: true };
      }

      applyKnockback(angleRad, power) {
        power *= this.knockbackResist;
        this.vx = Math.cos(angleRad) * power;
        this.vy = Math.sin(angleRad) * power;
        this.hitstun = 20;
        this.onGround = false;
      }

      respawn() {
        this.x = this.id === 'P1' ? 250 : 650;
        this.y = 100;
        this.vx = 0;
        this.vy = 0;
        this.damage = 0;
        this.hitstun = 0;
      }

      updateAI(target) {
        if (!this.isCPU || this.hitstun > 0) return;

        const dx = target.x - this.x;
        const absDx = Math.abs(dx);

        this.input.left = dx < -20;
        this.input.right = dx > 20;
        this.facing = dx >= 0 ? 1 : -1;

        if (this.onGround && Math.random() < 0.01) {
          this.input.jump = true;
        } else {
          this.input.jump = false;
        }

        const baseAttackProb = items.cpuWeak ? 0.03 : 0.08;
        if (absDx < 80 && this.onGround && Math.random() < baseAttackProb) {
          this.input.attack = true;
        } else {
          this.input.attack = false;
        }
      }

      update() {
        if (this.hitstun > 0) {
          this.hitstun--;
        } else {
          if (this.input.left) {
            this.vx = -this.moveSpeed;
            this.facing = -1;
          } else if (this.input.right) {
            this.vx = this.moveSpeed;
            this.facing = 1;
          } else {
            this.vx *= 0.7;
            if (Math.abs(this.vx) < 0.2) this.vx = 0;
          }

          if (this.input.jump && this.onGround) {
            this.vy = -this.jumpPower;
            this.onGround = false;
          }

          if (this.input.attack) {
            this.startAttack();
          }
        }

        this.vy += GRAVITY;

        this.x += this.vx;
        this.y += this.vy;

        if (this.y + this.height >= STAGE_TOP && this.y + this.height <= STAGE_TOP + 40) {
          if (this.vy >= 0 && this.x + this.width > STAGE_LEFT && this.x < STAGE_RIGHT) {
            this.y = STAGE_TOP - this.height;
            this.vy = 0;
            this.onGround = true;
          }
        }

        if (this.y + this.height > FLOOR_Y) {
          this.y = FLOOR_Y - this.height;
          this.vy = 0;
          this.onGround = true;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > 900) this.x = 900 - this.width;

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.attackTimer > 0) {
          this.attackTimer--;
          if (this.attackTimer <= 0 && this.attackHitbox) {
            this.attackHitbox.active = false;
          }
        }
      }

      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.fillStyle = 'white';
        ctx.font = '12px sans-serif';
        ctx.fillText(this.id, this.x + 5, this.y - 5);

        if (this.attackHitbox && this.attackHitbox.active) {
          if (this.flame || items.blueFlame) {
            ctx.strokeStyle = 'deepskyblue';
          } else {
            ctx.strokeStyle = 'yellow';
          }
          ctx.lineWidth = 2;
          const hb = this.attackHitbox;
          ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
        }
      }
    }

    const gameState = {
      fighters: [],
      frame: 0
    };

    let currentP1 = null;
    let currentCPU = null;
    let canvas = null;
    let ctx = null;
    let ui = null;

    function createFighterFromChar(id, isCPU) {
      let baseColor = isCPU ? 'tomato' : 'deepskyblue';
      let moveSpeed = 4;
      let atkMul = 1.0;
      let kbResist = 1.0;
      let jumpPower = 14;
      let flame = false;

      if (!isCPU) {
        switch (selectedCharacter) {
          case 'speedster':
            moveSpeed = 4.8;
            break;
          case 'tank':
            kbResist = 0.7;
            moveSpeed = 3.4;
            break;
          case 'assassin':
            atkMul = 1.25;
            moveSpeed = 4.2;
            break;
          case 'blazer':
            atkMul = 1.1;
            flame = true;
            break;
        }
        if (items.atkUp) atkMul *= 1.1;
        if (items.jumpUp) jumpPower *= 1.15;
      }

      return new Fighter({
        id,
        x: id === 'P1' ? 250 : 650,
        y: 100,
        color: baseColor,
        isCPU,
        moveSpeed,
        atkMultiplier: atkMul,
        knockbackResist: kbResist,
        jumpPower,
        flame
      });
    }

    function drawStage() {
      if (items.neonStage) {
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, FLOOR_Y, 900, 500 - FLOOR_Y);
        ctx.fillStyle = '#0ff';
        ctx.fillRect(STAGE_LEFT, STAGE_TOP, STAGE_RIGHT - STAGE_LEFT, 20);
        ctx.strokeStyle = '#f0f';
        ctx.lineWidth = 3;
        ctx.strokeRect(STAGE_LEFT, STAGE_TOP, STAGE_RIGHT - STAGE_LEFT, 20);
      } else {
        ctx.fillStyle = '#444';
        ctx.fillRect(0, FLOOR_Y, 900, 500 - FLOOR_Y);
        ctx.fillStyle = '#666';
        ctx.fillRect(STAGE_LEFT, STAGE_TOP, STAGE_RIGHT - STAGE_LEFT, 20);
      }
    }

    function handleAttacks() {
      const fighters = gameState.fighters;
      for (const attacker of fighters) {
        const hb = attacker.attackHitbox;
        if (!hb || !hb.active) continue;

        for (const target of fighters) {
          if (target.id === attacker.id) continue;
          if (target.hitstun > 0) continue;

          const hurt = target.getHurtbox();
          if (rectsOverlap(
            { x: hb.x, y: hb.y, w: hb.w, h: hb.h },
            { x: hurt.x, y: hurt.y, w: hurt.w, h: hurt.h }
          )) {
            hb.active = false;

            const baseDamage = 8;
            const damage = baseDamage * attacker.atkMultiplier;
            target.damage += damage;

            const angleDeg = attacker.facing === 1 ? -35 : -145;
            const angleRad = angleDeg * Math.PI / 180;
            const kbScale = KNOCKBACK_SCALE_BASE * attacker.atkMultiplier;
            const power = BASE_KNOCKBACK + target.damage * kbScale;

            target.applyKnockback(angleRad, power);
          }
        }
      }
    }

    function handleBlastZones() {
      for (const f of gameState.fighters) {
        if (
          f.x + f.width < BLAST_LEFT ||
          f.x > BLAST_RIGHT ||
          f.y + f.height < BLAST_TOP ||
          f.y > BLAST_BOTTOM
        ) {
          f.stocks--;
          if (f.stocks > 0) {
            f.respawn();
          } else {
            f.respawn();
            f.damage = 0;
          }
        }
      }
    }

    function drawUI() {
      ctx.fillStyle = 'white';
      ctx.font = '16px sans-serif';

      ctx.fillText(`P1: ${Math.floor(currentP1.damage)}%  Stocks: ${currentP1.stocks}`, 20, 30);
      ctx.fillText(`CPU: ${Math.floor(currentCPU.damage)}%  Stocks: ${currentCPU.stocks}`, 20, 55);

      ui.textContent =
        `Frame: ${gameState.frame}\n` +
        `P1(x:${currentP1.x.toFixed(1)}, y:${currentP1.y.toFixed(1)}, dmg:${currentP1.damage.toFixed(1)}, stun:${currentP1.hitstun})\n` +
        `CPU(x:${currentCPU.x.toFixed(1)}, y:${currentCPU.y.toFixed(1)}, dmg:${currentCPU.damage.toFixed(1)}, stun:${currentCPU.hitstun})\n` +
        `Char:${selectedCharacter}  Items:${JSON.stringify(items)}`;
    }

    function gameLoop() {
      if (!gameRunning) return;

      gameState.frame++;

      ctx.clearRect(0, 0, 900, 500);

      drawStage();

      currentCPU.updateAI(currentP1);

      for (const f of gameState.fighters) {
        f.update();
      }

      handleAttacks();
      handleBlastZones();

      for (const f of gameState.fighters) {
        f.draw(ctx);
      }

      drawUI();

      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      if (gameRunning) return;
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      ui = document.getElementById('ui');

      gameState.fighters = [];
      gameState.frame = 0;

      currentP1 = createFighterFromChar('P1', false);
      currentCPU = createFighterFromChar('CPU', true);

      gameState.fighters.push(currentP1, currentCPU);

      updateInputFromKeys();

      gameRunning = true;
      gameLoop();
    }

    function stopGame() {
      gameRunning = false;
      if (animationId) cancelAnimationFrame(animationId);
    }
  </script>

</body>
</html>
