<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UIテスト</title>
<style>
body{
  margin:0;
  background:#222;
  color:#fff;
  font-family:sans-serif;
}

/* UI は z-index 9999 で最前面 */
#ui{
  position:fixed;
  top:20px;
  left:20px;
  z-index:9999;
  background:#000a;
  padding:20px;
  border:1px solid #4ea3ff;
  border-radius:8px;
}

/* canvas は pointer-events:none で絶対にクリックを奪わない */
#game{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#444;
  pointer-events:none;
  z-index:1;
}
</style>
</head>
<body>

<div id="ui">
  <button id="btn1">ボタン1</button>
  <button id="btn2">ボタン2</button>
  <button id="btn3">ボタン3</button>
</div>

<div id="game"></div>

<script>
document.getElementById("btn1").onclick = ()=>alert("ボタン1 OK");
document.getElementById("btn2").onclick = ()=>alert("ボタン2 OK");
document.getElementById("btn3").onclick = ()=>alert("ボタン3 OK");
</script>

</body>
</html>
